name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 6. Install NPM Dependencies
        run: npm ci

      - name: 7. Run Typecheck & Test Suites
        run: |
          npm run typecheck
          npm run test
          npm run test:programming
          npm run test:gemini

      - name: 8. Expo Prebuild (Generate Android Native Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 9. Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias jungcheogi-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Jungcheogi,OU=Mobile,O=App,C=KR"

      - name: 10. Assemble Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
            -PMYAPP_UPLOAD_KEY_ALIAS=jungcheogi-alias \
            -PMYAPP_UPLOAD_STORE_PASSWORD=android \
            -PMYAPP_UPLOAD_KEY_PASSWORD=android

      - name: 11. Verify & Sign APK with apksigner
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          echo "=== Generated Build Artifacts ==="
          ls -lh "$APK_DIR"
          
          # If output is app-release-unsigned.apk and not app-release.apk, sign it explicitly
          if [ -f "$APK_DIR/app-release-unsigned.apk" ] && [ ! -f "$APK_DIR/app-release.apk" ]; then
            echo "Signing app-release-unsigned.apk with apksigner..."
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS/apksigner sign \
              --ks android/app/release.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$APK_DIR/app-release.apk" \
              "$APK_DIR/app-release-unsigned.apk"
          fi
          
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Rename and copy to root directory
          cp "$APK_DIR/app-release.apk" "jungcheogi-trainer-v${VERSION}.apk"
          echo "=== Final APK File Info ==="
          ls -lh "jungcheogi-trainer-v${VERSION}.apk"

      - name: 12. Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jungcheogi-trainer-v${{ env.VERSION }}-apk
          path: jungcheogi-trainer-v${{ env.VERSION }}.apk
          retention-days: 30

      - name: 13. Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ env.VERSION }}
          name: "정처기 실기 트레이너 v${{ env.VERSION }} APK"
          body: |
            ## 정처기 실기 트레이너 v${{ env.VERSION }} APK

            Assets에서 `jungcheogi-trainer-v${{ env.VERSION }}.apk`를 받으면 됩니다.

            ### 이번 버전 (v1.3.8)
            - AI 암기 문제 생성 시 3단계 강건한 JSON 복구 및 정밀 스키마 검증 (손상 배치 자동 폐기 및 재시도)
            - 생성 작업 영속화(MemoGenerationJob) 및 Ground-Truth 기반 중복 생성(Idempotency) 원천 방지
            - 묶음별 즉시 커밋(Incremental Commit): 1차 7문제 완료 즉시 영구 저장되어 강제 종료 시에도 1차분 100% 보존
            - 앱 라이프사이클(AppState) 연동: 백그라운드 전환/화면 복귀 시 미완료 작업 자동 이어받기
            - 홈 화면 새로고침(Pull-to-Refresh) 충돌 방어 및 실시간 상태 피드백 강화

            기존 앱과 서명이 다를 수 있으니, 설치 전 폰에서 예전 앱을 삭제한 뒤 설치하세요.
          files: jungcheogi-trainer-v${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
