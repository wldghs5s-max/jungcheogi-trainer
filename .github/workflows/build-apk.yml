name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 6. Install NPM Dependencies
        run: npm ci

      - name: 7. Run Typecheck & Test Suites
        run: |
          npm run typecheck
          npm run test
          npm run test:programming
          npm run test:gemini

      - name: 8. Expo Prebuild (Generate Android Native Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 9. Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias jungcheogi-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Jungcheogi,OU=Mobile,O=App,C=KR"

      - name: 10. Assemble Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PMYAPP_UPLOAD_STORE_FILE=release.keystore \
            -PMYAPP_UPLOAD_KEY_ALIAS=jungcheogi-alias \
            -PMYAPP_UPLOAD_STORE_PASSWORD=android \
            -PMYAPP_UPLOAD_KEY_PASSWORD=android

      - name: 11. Verify & Sign APK with apksigner
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          echo "=== Generated Build Artifacts ==="
          ls -lh "$APK_DIR"
          
          # If output is app-release-unsigned.apk and not app-release.apk, sign it explicitly
          if [ -f "$APK_DIR/app-release-unsigned.apk" ] && [ ! -f "$APK_DIR/app-release.apk" ]; then
            echo "Signing app-release-unsigned.apk with apksigner..."
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS/apksigner sign \
              --ks android/app/release.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$APK_DIR/app-release.apk" \
              "$APK_DIR/app-release-unsigned.apk"
          fi
          
          # Rename and copy to root directory
          cp "$APK_DIR/app-release.apk" jungcheogi-trainer-v1.3.4.apk
          echo "=== Final APK File Info ==="
          ls -lh jungcheogi-trainer-v1.3.4.apk

      - name: 12. Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jungcheogi-trainer-v1.3.4-apk
          path: jungcheogi-trainer-v1.3.4.apk
          retention-days: 30

      - name: 13. Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.3.4
          name: "정처기 실기 트레이너 v1.3.4 APK"
          body: |
            ## 📱 정처기 실기 트레이너 v1.3.4 APK 다운로드

            아래 **Assets** 항목에서 `jungcheogi-trainer-v1.3.4.apk`를 스마트폰으로 직접 다운로드하여 설치하실 수 있습니다!

            ### 🚀 이번 버전 주요 업데이트
            1. **답변 내 불필요한 별표(*, **) 기호 완전 정리 & 깔끔한 서식 렌더링**:
               - 답변에 지저분하게 노출되던 마크다운 별표(*, **)를 제거하고 깔끔한 모바일 볼드체 및 '•' 불릿 기호로 자동 변환 렌더링
               - AI 프롬프트에 별표 남발 억제 지침을 적용하여 가독성이 대폭 향상된 깔끔한 문장 제공
            2. **실시간 토큰 스트리밍(SSE) UI 도입**:
               - 답변이 모두 완성될 때까지 기다릴 필요 없이 첫 글자부터 실시간 타자 연출로 즉시 표출 (체감 대기 시간 1초 미만)
            3. **1:1 맞춤형 심층 연속 과외 (멀티턴 대화 히스토리)**:
               - 이전 질문과 튜터의 설명 맥락을 기억하여 연속적인 심층 질문-답변 가능
            4. **답변 출력 토큰 상한 2,048개로 대폭 확장**:
               - 복잡한 코드 실행 과정과 심층 이론 해설이 중간 끊김 없이 완벽하게 제공
          files: jungcheogi-trainer-v1.3.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
